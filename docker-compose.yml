
services:
  api:
    image: ghcr.io/kahmeng15/stagecontrol-api:latest
    container_name: stagecontrol-api
    restart: unless-stopped
    ports:
      - "1551:8000"
    environment:
      - DATABASE_URL=sqlite:////storage/db/stageflow.db
      - SECRET_KEY=stagecontrol-super-secure-dev-secret-key-change-in-prod-2026
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_HLS_URL=http://localhost:8888
      - MEDIAMTX_WEBRTC_URL=http://localhost:8889
      - MEDIAMTX_RTMP_URL=rtmp://mediamtx:1935
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/kahmeng15/stagecontrol-web:latest
    container_name: stagecontrol-web
    restart: unless-stopped
    ports:
      - "1550:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://api:8000
      - INTERNAL_MEDIAMTX_HLS_URL=http://mediamtx:8888
      - INTERNAL_MEDIAMTX_WEBRTC_URL=http://mediamtx:8889
    depends_on:
      - api
      - mediamtx

  mediamtx:
    image: ghcr.io/kahmeng15/stagecontrol-mediamtx:latest
    container_name: stagecontrol-mediamtx
    restart: unless-stopped
    environment:
      - MTX_HLSSEGMENTCOUNT=20
    ports:
      - "1935:1935"       # RTMP (OBS stream ingest)
      - "8888:8888"       # HLS stream & playback
      - "8889:8889"       # WebRTC player & WHIP ingest
      - "8189:8189/udp"   # WebRTC ICE UDP media stream
      - "8189:8189/tcp"   # WebRTC ICE TCP media fallback
      - "9996:9996"       # HTTP Playback API & player
      - "9997:9997"       # Management API
    volumes:
      - ./services/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./storage/recordings:/recordings

volumes:
  storage:
