# MediaMTX Configuration for StageControl

logLevel: info
logDestinations: [stdout]

# API for stats and stream state
api: yes
apiAddress: :9997

# Authentication permissions
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

# RTMP Server (OBS input)
rtmp: yes
rtmpAddress: :1935

# WebRTC Server (low-latency browser playback & WHIP ingest)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: ['localhost', '127.0.0.1']


# HLS Server (rock-solid buffered playback for 4G / mobile / remote viewers)
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsSegmentCount: 20

# HTTP Playback Server for recorded fMP4 segments
playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

# Paths
paths:
  all:
    # Allow RTMP / WHIP publishers
    source: publisher

  # Transcoded low-res streams (do not re-transcode or record)
  ~^live/(?P<key>[^/]+)_low$:
    source: publisher

  # Live streams with automated fMP4 recording to persistent volume
  ~^live/(?P<key>[^/]+)$:
    source: publisher
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 1h

    # Automatically generate low-bandwidth 720p @ 800kbps live rendition:
    runOnReady: >
      ffmpeg -hide_banner -loglevel warning
      -i rtmp://localhost:1935/live/$key
      -vf "scale=1280:720"
      -c:v libx264 -preset veryfast -tune zerolatency
      -b:v 800k -maxrate 950k -bufsize 1600k
      -g 60 -keyint_min 60 -sc_threshold 0
      -c:a aac -b:a 64k -ar 44100
      -f flv rtmp://localhost:1935/live/${key}_low
    runOnReadyRestart: yes


