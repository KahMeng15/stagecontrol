# MediaMTX Configuration for StageControl

logLevel: info
logDestinations: [stdout]

# API for stats and stream state
api: yes
apiAddress: :9997

# Authentication permissions
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

# RTMP Server (OBS input)
rtmp: yes
rtmpAddress: :1935

# WebRTC Server (low-latency browser playback & WHIP ingest)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: ['localhost', '127.0.0.1']


# HLS Server (rock-solid buffered playback for 4G / mobile / remote viewers)
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentDuration: 2s
hlsSegmentCount: 20

# HTTP Playback Server for recorded fMP4 segments
playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

# Paths
paths:
  all:
    # Allow RTMP / WHIP publishers
    source: publisher
    recordDeleteAfter: 0s  # Disables automatic deletion globally

  # Transcoded low-res streams (sorted before ~^live/(?P<key>...) so it is never re-transcoded or recorded)
  ~^live/(.*_low)$:
    source: publisher
    record: no

  # Live streams with automated fMP4 recording to persistent volume
  ~^live/(?P<key>[^/]+)$:
    source: publisher
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 1h
    recordDeleteAfter: 0s  # Explicitly prevents deletion of all live takes

    # Automatically generate low-bandwidth 720p @ 800kbps live rendition:
    runOnAvailable: >
      sh -c 'case "$MTX_PATH" in *_low) exit 0 ;; esac;
      exec ffmpeg -hide_banner -loglevel warning
      -i rtmp://localhost:1935/$MTX_PATH
      -vf "scale=1280:720"
      -c:v libx264 -preset veryfast -tune zerolatency
      -b:v 800k -maxrate 950k -bufsize 1600k
      -g 60 -keyint_min 60 -sc_threshold 0
      -c:a aac -b:a 64k -ar 44100
      -f flv rtmp://localhost:1935/${MTX_PATH}_low'
    runOnAvailableRestart: yes

    # Phase 1: Automated stream end hook (notifies FastAPI when publisher disconnects)
    runOnOffline: >
      sh -c 'case "$MTX_PATH" in *_low) exit 0 ;; esac; KEY=$(basename "$MTX_PATH"); curl -s -X POST http://api:8000/api/events/by-stream-key/$KEY/post-process-recordings || wget -qO- --post-data="" http://api:8000/api/events/by-stream-key/$KEY/post-process-recordings || true'

    # Triggers pipeline when recorded segment file is finalized and closed on disk
    runOnRecordSegmentComplete: >
      sh -c 'case "$MTX_PATH" in *_low) exit 0 ;; esac; KEY=$(basename "$MTX_PATH"); curl -s -X POST http://api:8000/api/events/by-stream-key/$KEY/post-process-recordings || true'



